const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function unlock(pw,silent){
  const b=document.getElementById("go");b.textContent="Unlocking...";
  try{
    const key=await derive(pw);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(CT));
    try{sessionStorage.setItem("bhc_pw",pw);}catch(e){}
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){
    b.textContent="Unlock";
    if(!silent)document.getElementById("err").textContent="That password did not work.";
  }
}
document.getElementById("go").onclick=()=>unlock(document.getElementById("pw").value,false);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock(document.getElementById("pw").value,false);});
try{const s=sessionStorage.getItem("bhc_pw");if(s)unlock(s,true);}catch(e){}
document.getElementById("pw").focus();
</script>
