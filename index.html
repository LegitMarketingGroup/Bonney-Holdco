<style>
body{margin:0;background:#131C2E;font-family:"Segoe UI",Calibri,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;width:420px;max-width:92vw;padding:38px 42px 30px;box-shadow:0 18px 60px rgba(0,0,0,.45);border-top:6px solid #9E3B3B}

input{width:100%;box-sizing:border-box;padding:13px 12px;font-size:15px;border:1px solid #D9DFE8;outline:none}

button{width:100%;margin-top:14px;padding:14px;background:#1F2A44;color:#fff;font-size:15px;font-weight:700;border:0;cursor:pointer}
button:hover{background:#17375E}
.err{color:#B94040;font-size:12px;min-height:16px;margin-top:8px}
.foot{font-size:11px;color:#8A97AB;text-align:center;margin-top:20px;border-top:1px solid #EDF0F5;padding-top:14px}

const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function unlock(pw,silent){
  const b=document.getElementById("go");b.textContent="Unlocking...";
  try{
    const key=await derive(pw);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(CT));
    try{sessionStorage.setItem("bhc_pw",pw);}catch(e){}
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){
    b.textContent="Unlock";
    if(!silent)document.getElementById("err").textContent="That password did not work.";
  }
}
document.getElementById("go").onclick=()=>unlock(document.getElementById("pw").value,false);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock(document.getElementById("pw").value,false);});

document.getElementById("pw").focus();
